name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una nuova esecuzione sulla stessa PR annulla quella in corso
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Test unitari (canone, PDF, mail)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Test unitari
        run: npm run test:unit

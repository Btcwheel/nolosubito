name: Migrazione immagini gigi → Supabase

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Quante immagini processare (default 10)'
        required: false
        default: '10'

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Esegui migrazione
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          BATCH=${{ github.event.inputs.batch || '10' }}
          node scripts/migrate-images.cjs --batch $BATCH

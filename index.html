    <!-- Google Consent Mode v2 — default "denied" finché l'utente non sceglie dal banner cookie -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      window.__updateConsent = (prefs) => {
        gtag('consent', 'update', {
          analytics_storage: prefs.analytics ? 'granted' : 'denied',
          ad_storage: prefs.marketing ? 'granted' : 'denied',
          ad_user_data: prefs.marketing ? 'granted' : 'denied',
          ad_personalization: prefs.marketing ? 'granted' : 'denied',
        });
      };
    </script>
    <!-- Google Analytics 4 — loaded after first render to protect mobile TBT; il tracking resta "denied" fino al consenso (Consent Mode v2) -->
    <script>
      window.addEventListener('load', () => {
        const loadAnalytics = () => {
          const script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-KVKGSKMKLK';
          script.async = true;
          document.head.appendChild(script);
          gtag('js', new Date());
          gtag('config', 'G-KVKGSKMKLK');
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAnalytics, { timeout: 3000 });
        } else {
          setTimeout(loadAnalytics, 3000);
        }
      });
    </script>

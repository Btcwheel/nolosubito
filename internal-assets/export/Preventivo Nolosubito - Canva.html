U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n  :root{\n    --ink:#0E1A2E;\n    --ink-2:#1F2B42;\n    --muted:#5E6B82;\n    --muted-2:#8693AB;\n    --line:#E2E7F0;\n    --line-2:#EDF0F6;\n    --bg:#F4F6FB;\n    --bg-2:#FAFBFD;\n    --brand:#2B2D87;       /* Nolosubito indigo */\n    --brand-2:#3A3DA6;     /* slightly lighter indigo */\n    --brand-soft:#ECEDF7;  /* tint */\n    --accent:#FFB100;      /* warm amber */\n    --accent-soft:#FFF4D6;\n    --green:#15815A;\n    --red:#C8412B;\n    --shadow: 0 1px 2px rgba(14,26,46,.04), 0 8px 24px rgba(14,26,46,.06);\n    --radius: 14px;\n  }\n\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:#E7ECF3;color:var(--ink);font-family:\"Manrope\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n  body{padding:32px 0;}\n\n  /* A4 page — 210×297mm at 96dpi ≈ 794×1123, we use 800×1131 for cleaner numbers */\n  .page{\n    width:800px;\n    min-height:1131px;\n    margin:0 auto 28px;\n    background:#fff;\n    box-shadow: 0 30px 60px -20px rgba(14,26,46,.18), 0 8px 24px rgba(14,26,46,.08);\n    position:relative;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n  }\n\n  /* ============ TOP BAR ============ */\n  .topbar{\n    height:14px;\n    background:linear-gradient(90deg, var(--brand) 0%, var(--brand) 65%, var(--accent) 65%, var(--accent) 100%);\n    flex-shrink:0;\n  }\n\n  /* ============ HEADER ============ */\n  header.doc-head{\n    padding:26px 44px 22px;\n    display:flex;\n    align-items:flex-start;\n    justify-content:space-between;\n    gap:24px;\n    border-bottom:1px solid var(--line);\n  }\n  .logo-wrap{display:flex;align-items:center;gap:14px;}\n  .logo-img{height:48px;width:auto;display:block;}\n  .logo-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-left:14px;border-left:1px solid var(--line);line-height:1.3;max-width:140px;}\n\n  .offer-meta{\n    text-align:right;\n    display:flex;flex-direction:column;gap:6px;\n  }\n  .offer-meta .label{\n    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600;\n  }\n  .offer-meta .number{\n    font-family:\"DM Mono\",monospace;\n    font-size:15px;color:var(--ink);font-weight:500;\n  }\n  .offer-meta .date{font-size:11.5px;color:var(--muted);}\n  .offer-meta .valid{\n    margin-top:4px;\n    display:inline-flex;align-items:center;gap:6px;\n    background:var(--accent-soft);color:#7A5400;\n    padding:5px 10px;border-radius:999px;\n    font-size:10.5px;font-weight:700;letter-spacing:.02em;\n    align-self:flex-end;\n  }\n  .offer-meta .valid::before{\n    content:\"\";width:6px;height:6px;border-radius:50%;background:var(--accent);\n  }\n\n  /* ============ TITLE BLOCK ============ */\n  .title-block{\n    padding:32px 44px 24px;\n    background:\n      radial-gradient(900px 200px at 100% 0%, rgba(255,177,0,.07), transparent 60%),\n      linear-gradient(180deg, #fff, #FAFBFD);\n  }\n  .eyebrow{\n    display:inline-block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;\n    color:var(--brand);font-weight:700;\n    padding:5px 10px;background:var(--brand-soft);border-radius:6px;margin-bottom:14px;\n  }\n  h1.title{\n    font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1;color:var(--brand);margin:0 0 14px;\n  }\n  h1.title em{font-style:normal;color:var(--ink);font-weight:700;}\n  .lede{font-size:13.5px;line-height:1.65;color:var(--ink-2);max-width:680px;margin:0;}\n  .lede strong{color:var(--brand);font-weight:700;}\n\n  /* ============ TWO-COL ============ */\n  .pair{\n    display:grid;grid-template-columns:1fr 1fr;gap:18px;\n    padding:6px 44px 22px;\n  }\n  .card{\n    background:#fff;border:1px solid var(--line);border-radius:var(--radius);\n    padding:18px 20px;position:relative;\n  }\n  .card .head{\n    display:flex;align-items:center;justify-content:space-between;\n letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:6px;\n  }\n  .canone-hero .ch-amount{\n    position:relative;z-index:1;\n    font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1;\n    display:flex;align-items:baseline;gap:4px;\n  }\n  .canone-hero .ch-amount .cur{font-size:22px;font-weight:700;color:var(--accent);}\n  .canone-hero .ch-amount .per{font-size:14px;font-weight:600;color:rgba(255,255,255,.7);margin-left:6px;}\n  .canone-hero .ch-sub{\n    position:relative;z-index:1;\n    margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.7);\n  }\n  .canone-hero .ch-anticipo{\n    position:relative;z-index:1;\n    margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.2);\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:12px;\n  }\n  .canone-hero .ch-anticipo .l{color:rgba(255,255,255,.75);}\n  .canone-hero .ch-anticipo .v{\n    color:var(--accent);font-weight:700;font-size:14px;\n    background:rgba(255,177,0,.14);padding:3px 10px;border-radius:999px;\n  }\n\n  /* ============ SERVICES ============ */\n  .services{\n    padding:0 44px 30px;\n  }\n  .section-title{\n    display:flex;align-items:center;gap:10px;margin:0 0 14px;\n  }\n  .section-title h3{\n    font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin:0;\n  }\n  .section-title .rule{flex:1;height:1px;background:var(--line);}\n  .section-title .badge{\n    background:var(--brand-soft);color:var(--brand);\n    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;\n  }\n  .services-grid{\n    display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;\n  }\n  .service{\n    display:flex;gap:10px;align-items:flex-start;\n    padding:10px 4px;\n    font-size:12px;line-height:1.35;color:var(--ink-2);\n    border-bottom:1px solid var(--line-2);\n  }\n  .service:last-child, .service:nth-last-child(2):nth-child(3n+1), .service:nth-last-child(3):nth-child(3n+1){\n    /* keep simple — leave borders */\n  }\n  .service .check{\n    flex-shrink:0;width:18px;height:18px;border-radius:6px;\n    background:#E8F4EE;color:var(--green);\n    display:grid;place-items:center;margin-top:1px;\n  }\n  .service .check svg{width:11px;height:11px;}\n  .service strong{font-weight:600;color:var(--ink);}\n  .service .meta{display:block;color:var(--muted);font-size:10.5px;margin-top:1px;font-weight:500;}\n\n  /* ============ FOOTER ============ */\n  .doc-foot{\n    margin-top:auto;\n    padding:14px 44px;\n    border-top:1px solid var(--line);\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:10.5px;color:var(--muted);\n    background:var(--bg-2);\n  }\n  .doc-foot .left{display:flex;align-items:center;gap:8px;}\n  .doc-foot .left .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}\n  .doc-foot .right{font-variant-numeric:tabular-nums;}\n\n  /* ============ PAGE 2 ============ */\n  .specs-grid{\n    padding:0 44px 22px;\n    display:grid;grid-template-columns:1fr 1fr;gap:24px 44px;\n  }\n  .spec-table{display:flex;flex-direction:column;}\n  .spec-row{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:9px 0;border-bottom:1px solid var(--line-2);\n    font-size:12.5px;\n  }\n  .spec-row .k{color:var(--muted);}\n  .spec-row .v{color:var(--ink);font-weight:600;text-align:right;max-width:60%;}\n  .spec-row:first-child{border-top:1px solid var(--line-2);}\n\n  /* listino card */\n  .listino{\n    padding:0 44px 22px;\n  }\n  .listino-inner{\n    background:var(--bg);border-radius:var(--radius);padding:18px 22px;\n    display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;\n  }\n  .listino-inner .item .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}\n  .listino-inner .item .v{font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}\n  .
